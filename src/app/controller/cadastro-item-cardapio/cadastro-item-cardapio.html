<app-header></app-header>

<div class="container-conteudo">
    <div class="container">
        <div class="container-selecao">
            <h3 class="titulo">{{uuidItemAlteracao ? 'Alteração de item': 'Cadastro de item'}} </h3>
            <div class="area-campos"> 
                <div class="col-md-12">
                    <textfield required="true" [(ngModel)]="item().nome" class="col-md-9" name="nome" id="campo-nome" valor="{{item().nome}}" placeholder="Digite o nome do item" ngDefaultControl />    
                    <textfield [(ngModel)]="item().valor" [monetario]="true" class="col-md-3" name="preco" #preco id="campo-preco" valor="{{item().valor}}" placeholder="R$ 0,00" ngDefaultControl/>                
                </div>    
                
                <textfield [(ngModel)]="item().descricao" class="col-md-12" name="descricao" ngDefaultControl id="campo-descricao" valor="{{item().descricao}}" placeholder="Digite a descrição do item" />

                <div class="col-md-12 container-imagem">        
                    <app-file-chooser [(ngModel)]="item().imagemBaixada" name="fileUpload" ngDefaultControl class="col-md-12" textoPlaceholder="Selecione a imagem do item" #fileUpload (onChangeFile)="onSeleciona($event)"></app-file-chooser>        
                    <img [src]="item().imagemBaixada" name="imagemItem">
                </div>

                <div class="col-md-12 container-campos">
                    <div class="col-md-3">
                        <app-checkbox [(ngModel)]="item().tipoItem" name="chkSubitem" (eventCheck)="checkEvent($event)" texto="Subitem?" ngDefaultControl></app-checkbox>
                    </div>

                    <div class="col-md-9">
                        <app-datalist name="selectCategoria" placeholder="Selecione a categoria" (onSeleciona)="alteraCategoria($event)" [adicionaItem]=true  [itens]=getCategorias() ngDefaultControl></app-datalist>
                    </div>
                </div>

                <div class="area-subitem">
                    <app-button [primario]="false" texto="Alterar subitens" (click)="alterarSubitens()"/>
                </div>
                <hr>            
            </div>

            <div class="area-botoes">
                <app-button [primario]="false" (click)="voltar()" texto="Fechar"/>
                <app-button type="submit" (click)="enviar()" texto="Salvar"/>
            </div>
        </div>
    </div>
</div>


<footer></footer>
