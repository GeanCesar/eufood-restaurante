<div class="container-selecao">
  <h3 class="titulo">Categoria subitens</h3>

  <div class="area-adicao-categoria" (click)="adicionaNovo()">
    <p>+ Adicionar nova categoria</p>
  </div>

  <div cdkDropList (cdkDropListDropped)="drop($event)" class="categoria-list" >
    @for (categoria of categorias(); track categoria) {
      <div (dblclick)="iniciaEdicao(categoria)" class="categoria-box" cdkDrag>

        <div class="container-remover">
            <fa-icon (click)="remover(categoria)" [icon]="faTimes"></fa-icon>
        </div>

        @if(!categoria.editando) {
          <label>{{ categoria.descricao }} </label>
        } @else {
          <textfield [(ngModel)]=categoria.descricao
              name="categoria" ngDefaultControl
              placeholder="Digite o nome da categoria"
              id="campo-categoria"  value="Teste" valor="{{categoria.descricao}}"
              (focusout)="finalizaEdicao(categoria)" (keyup.enter)="finalizaEdicao(categoria)"/>
        }
        
        <fa-icon [icon]="faGrip"></fa-icon>
      </div>
    }
  </div>
</div>
