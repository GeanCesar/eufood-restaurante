<ng-select #select
     class="campo"
     [(ngModel)]="itemSelecionado"
     (change)="seleciona(itemSelecionado)"
     ngDefaultControl
     placeholder="{{placeholder}}"
     [addTag]="adicionaItem"
     addTagText="Adicione um item">
    @for (item of itens; track $index) {
        <ng-option [value]="item.objeto">{{item.texto}}</ng-option>
    }
</ng-select>
